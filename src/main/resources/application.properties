spring.application.name=servelq
server.port=${PORT:8085}
spring.jackson.mapper.accept-case-insensitive-enums=true
# ---------------------------------------------------------------------------
# Everything secret or environment-specific comes from the environment.
# No working defaults on purpose - better to fail at startup than to come up
# pointing at the wrong database. See README-CONFIG.md for the full list.
# ---------------------------------------------------------------------------
# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
# JPA. validate (not update) anywhere but local - schema changes go through a
# migration so they get reviewed instead of being applied silently at boot.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# CORS - comma separated list of exact origins, no wildcard
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMinutes=${JWT_EXPIRATION_MINUTES:720}
# Twilio. Left blank means WhatsApp sending is skipped.
twilio.sid=${TWILIO_SID:}
twilio.token=${TWILIO_TOKEN:}
twilio.from=${TWILIO_FROM:}
# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Firebase. Path to the service account json. Push is skipped if unset.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# Actuator - health for probes, nothing else exposed
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Logging
logging.level.root=INFO
logging.level.com.gis.servelq=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.stat=OFF
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
ad.ldap.urls=ldap://MSSPFDCPR01.MSSPF.OM:389,ldap://MSSPFDCPR02.MSSPF.OM:389
ad.ldap.base-dn=DC=MSSPF,DC=OM
ad.ldap.bind-user=MSSPF\\svc_meeting
ad.ldap.bind-password=${AD_PASSWORD:}
ad.ldap.domain=MSSPF.OM
ad.ldap.user-search-base=DC=MSSPF,DC=OM
ad.ldap.user-search-filter=(&(objectCategory=person)(objectClass=user)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))
ad.ldap.staff-id-attribute=employeeID
ad.ldap.display-name-attribute=displayName
ad.ldap.mail-attribute=mail
ad.ldap.department-attribute=department
ad.ldap.title-attribute=title
# Video/Image Upload & Archive
video.upload.dir=${VIDEO_UPLOAD_DIR:uploads/videos}
video.chunk.dir=${VIDEO_CHUNK_DIR:uploads/chunks}
video.hls.dir=${VIDEO_HLS_DIR:uploads/hls}
video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
video.archive.dir=${VIDEO_ARCHIVE_DIR:uploads/archived/videos}
video.hls-archive.dir=${VIDEO_HLS_ARCHIVE_DIR:uploads/archived/hls}
image.archive.dir=${IMAGE_ARCHIVE_DIR:uploads/archived/images}
# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
app.base-url=${APP_BASE_URL:http://localhost:8085}
smsoman.url=https://smsoman.com/API/sendsms
smsoman.username=${SMSOMAN_USERNAME:}
smsoman.password=${SMSOMAN_PASSWORD:}
smsoman.sender=${SMSOMAN_SENDER:}
smsoman.priority=${SMSOMAN_PRIORITY:1}
smsoman.app-id=${SMSOMAN_APP_ID:serveiq}