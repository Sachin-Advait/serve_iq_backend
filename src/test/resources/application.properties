# Values for the context-loads test only. H2 in Postgres mode stands in for the
# real database so the test does not need one running.
spring.datasource.url=jdbc:h2:mem:serveiq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# The migrations are Postgres specific (partial indexes, ::date casts), so let
# Hibernate build the schema for tests instead.
spring.flyway.enabled=false

app.jwt.secret=test-only-signing-key-that-is-long-enough-for-hs256
app.jwt.expirationMinutes=60
app.cors.allowed-origins=http://localhost:3000

# Blank on purpose - exercises the "integration not configured" paths.
twilio.sid=
twilio.token=
twilio.from=
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
firebase.credentials-path=

logging.level.root=WARN
